# 主配置（公共部分）。环境差异放 config.{MCP_ENV}.yaml 覆盖层：
#   MCP_ENV=dev  （默认，本地开发）   → config.dev.yaml
#   MCP_ENV=prod （生产部署）         → config.prod.yaml
# 值支持环境变量占位符：变量名放大括号，冒号后可带默认值（写法见 README）；
# 变量缺失且无默认值时启动即报错。

server:
  name: db-query-server
  transport: http        # stdio（本地被客户端拉起）| http（独立部署，监听 host:port）
  host: 0.0.0.0
  port: 9001

# 日志：logs/ 目录自动创建；app.log 收全部，error.log 只收 WARNING 及以上，
# stderr 控制台同步输出（stdio 模式客户端可见）
logging:
  level: INFO
  dir: logs
  max_bytes: 10485760       # 单文件 10MB，超出轮转
  backup_count: 5

# 连接池默认值（每个数据库一个池），单个数据库可用 pool_size 覆盖
pool:
  size: 5                 # 池上限（固定池，不超发）
  connect_timeout_ms: 3000    # 借出等待超时；池满报错让模型稍后重试
  max_lifetime_s: 1740    # 连接最长存活（29 分钟），到寿自动重建
  pre_ping: true          # 借出前先 ping，死连接当场换新

# 查询执行（asyncio 任务池）
query:
  workers: 20             # 同时执行的查询数
  queue_size: 64          # 排队上限；满了直接拒绝，绝不无限堆积
  task_ttl_minutes: 30    # 任务记录保留时长，过期查询按“不存在”处理
  max_tasks: 200          # 内存中最多保留的任务数，超出按最久未访问淘汰
  inline_max_rows: 5      # 结果行数不超过此值 → 直接在工具回复里展示（不落文件）；
                          # 超过 → 照常落 CSV 给下载链接。0 = 永远落文件

# 查询结果落盘与下载
results:
  dir: results
  ttl_minutes: 40         # 结果文件保留时长，必须大于 query.task_ttl_minutes
  max_total_bytes: 10737418240    # 目录总容量兜底（10GB）
  download_base_url: ""   # http 模式必填：Agent 下载文件用的对外地址，缺失启动即失败

# 数据源实例：数据源 = 一套连接（多台主机一组），下挂多个库（catalogs）。
# 常用布局：一个数据环境（stg1 / stg2 / dstg2 …）配一条数据源，数据源名用环境名；
# 查询的 database 参数既可填环境名（落到该环境第一个库），也可填具体库名。
# 库名必须在所有数据源间唯一（启动校验），行里一般靠环境后缀区分。
# dialect 必填；mysql 的库在查询时动态切换，不固定在连接上。
databases: {}
