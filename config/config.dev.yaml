# 本地开发环境（默认）：SQLite 演示库 + http 传输。
# demo.db 由 make_demo_db.py 生成（50 行 orders 表）。

server:
  name: db-query-server
  transport: http        # stdio（本地被客户端拉起）| http（独立部署，监听 host:port）
  host: 0.0.0.0
  port: 9000

results:
  download_base_url: http://localhost:9000/results   # 与上面的 port 对齐，否则下载链接打不开

databases:
  demo:
    dialect: sqlite
    path: demo.db          # 相对路径按项目目录解析
    catalogs: [ demo ]     # sqlite 一个文件就是一个库
