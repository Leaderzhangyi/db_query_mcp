# 生产环境（银行内网）：真实 MySQL 实例，参数与 Java 版 application.yml 完全一致。
# 启动：SPRING_PROFILES_ACTIVE=prod  或  python server.py --spring.profiles.active=prod
# 凭据走环境变量，缺失时启动即失败（与 Spring 占位符行为一致，不给默认值）：
#   MYSQL_USER / MYSQL_PASSWORD / DOWNLOAD_BASE_URL

mcp:
  db:
    result:
      download-base-url: ${DOWNLOAD_BASE_URL}

    instances:
      # ---------- MySQL：一个实例挂多个 database，共用一套只读账号 ----------
      mysql:
        url: jdbc:mysql:loadbalance://10.69.43.11:9030,10.69.43.12:9030,10.69.43.13:9030
        # URL 里不带库名，库由 select_db 动态切换（对应 Java 版 setCatalog）
        username: ${MYSQL_USER}
        password: ${MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver   # Python 版忽略，保留兼容
        # 库名数组：这里填的就是库里真实的 database 名
        catalogs: [ sdls_des, sdp_ial_des, sdp_icl_des, sdp_isl_des, srpts_des ]
        maximum-pool-size: 8                          # Python 版暂无连接池，保留兼容
        data-source-properties:                       # Hikari/驱动参数，Python 版忽略
          cachePrepStmts: "true"
          useServerPrepStmts: "true"
          prepStmtCacheSize: "250"
          prepStmtCacheSqlLimit: "2048"
          rewriteBatchedStatements: "true"
